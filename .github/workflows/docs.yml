# Builds the documentation site (Jekyll source in docs/) and deploys it to
# GitHub Pages as a workflow artifact — nothing generated is ever committed.
# Adapted from actions/starter-workflows pages/jekyll.yml; bundler-cache is
# off because no Gemfile.lock is committed (no local Ruby toolchain).
name: Deploy docs site

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Install dependencies
        run: bundle install
      # TEMPORARY: hand the CI-generated lockfile back so it can be committed
      # (no local Ruby toolchain). Remove once Gemfile.lock is in the repo.
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: gemfile-lock
          path: docs/Gemfile.lock
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
