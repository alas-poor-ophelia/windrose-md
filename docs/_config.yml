title: Windrose MapDesigner
description: >-
  Documentation for Windrose MapDesigner — a TTRPG dungeon and world map
  designer that lives inside your Obsidian notes. Grid and hex maps, tiles,
  fog of war, sub-maps, travel tools, and deep Obsidian integration.
url: "https://alas-poor-ophelia.github.io"
# baseurl is intentionally blank: the docs workflow injects the real base path
# at build time via actions/configure-pages (--baseurl flag).
baseurl: ""

theme: just-the-docs
color_scheme: dark

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

aux_links:
  GitHub:
    - "https://github.com/alas-poor-ophelia/windrose-md"
  Releases:
    - "https://github.com/alas-poor-ophelia/windrose-md/releases"

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow

# docs/ doubles as the repo's dev-docs folder; keep contributor-facing
# material out of the published site. FEATURES.md remains the GitHub-facing
# single-file reference; its content is carved into the site's pages.
exclude:
  - CONTRIBUTING.md
  - FEATURES.md
  - proposals/
  - vendor/
  - Gemfile
  - Gemfile.lock
