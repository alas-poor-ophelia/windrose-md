<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Standalone export of src/components/shared/WindroseCompass.tsx (static filter ids). -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="whiteGlow">
      <feGaussianBlur stdDeviation="1.0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="darkGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ringGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="compassShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0, 0, 0, 0.8)"/>
    </filter>
  </defs>

  <g filter="url(#compassShadow)">

    <!-- Background circle -->
    <circle cx="50" cy="50" r="28" fill="rgba(0, 0, 0, 0.7)" stroke="rgba(196, 165, 123, 0.4)" stroke-width="2"/>

    <!-- Outer decorative rings -->
    <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.8" filter="url(#ringGlow)"/>
    <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(196, 165, 123, 0.3)" stroke-width="0.5"/>
    <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.8" filter="url(#ringGlow)"/>
    <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(196, 165, 123, 0.2)" stroke-width="0.5"/>

    <!-- Cardinal direction lines -->
    <line x1="50" y1="2" x2="50" y2="22" stroke="rgba(0, 0, 0, 0.9)" stroke-width="7" stroke-linecap="round" filter="url(#darkGlow)"/>
    <line x1="50" y1="2" x2="50" y2="22" stroke="rgba(255, 255, 255, 0.8)" stroke-width="6" stroke-linecap="round" filter="url(#whiteGlow)"/>
    <line x1="50" y1="2" x2="50" y2="22" stroke="#c4a57b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="2" x2="50" y2="22" stroke="#c4a57b" stroke-width="1" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>

    <line x1="50" y1="78" x2="50" y2="98" stroke="rgba(0, 0, 0, 0.75)" stroke-width="5" stroke-linecap="round" filter="url(#darkGlow)"/>
    <line x1="50" y1="78" x2="50" y2="98" stroke="rgba(255, 255, 255, 0.6)" stroke-width="4.5" stroke-linecap="round" filter="url(#whiteGlow)"/>
    <line x1="50" y1="78" x2="50" y2="98" stroke="rgba(196, 165, 123, 0.55)" stroke-width="0.9" stroke-linecap="round"/>

    <line x1="78" y1="50" x2="98" y2="50" stroke="rgba(0, 0, 0, 0.75)" stroke-width="5" stroke-linecap="round" filter="url(#darkGlow)"/>
    <line x1="78" y1="50" x2="98" y2="50" stroke="rgba(255, 255, 255, 0.6)" stroke-width="4.5" stroke-linecap="round" filter="url(#whiteGlow)"/>
    <line x1="78" y1="50" x2="98" y2="50" stroke="rgba(196, 165, 123, 0.55)" stroke-width="0.9" stroke-linecap="round"/>

    <line x1="2" y1="50" x2="22" y2="50" stroke="rgba(0, 0, 0, 0.75)" stroke-width="5" stroke-linecap="round" filter="url(#darkGlow)"/>
    <line x1="2" y1="50" x2="22" y2="50" stroke="rgba(255, 255, 255, 0.6)" stroke-width="4.5" stroke-linecap="round" filter="url(#whiteGlow)"/>
    <line x1="2" y1="50" x2="22" y2="50" stroke="rgba(196, 165, 123, 0.55)" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Secondary direction lines (NE, SE, SW, NW) -->
    <line x1="71" y1="29" x2="82" y2="18" stroke="rgba(0, 0, 0, 0.5)" stroke-width="3" stroke-linecap="round" filter="url(#darkGlow)"/>
    <line x1="71" y1="29" x2="82" y2="18" stroke="rgba(196, 165, 123, 0.68)" stroke-width="0.8" stroke-linecap="round"/>

    <line x1="71" y1="71" x2="82" y2="82" stroke="rgba(0, 0, 0, 0.5)" stroke-width="3" stroke-linecap="round" filter="url(#darkGlow)"/>
    <line x1="71" y1="71" x2="82" y2="82" stroke="rgba(196, 165, 123, 0.68)" stroke-width="0.8" stroke-linecap="round"/>

    <line x1="29" y1="71" x2="18" y2="82" stroke="rgba(0, 0, 0, 0.5)" stroke-width="3" stroke-linecap="round" filter="url(#darkGlow)"/>
    <line x1="29" y1="71" x2="18" y2="82" stroke="rgba(196, 165, 123, 0.68)" stroke-width="0.8" stroke-linecap="round"/>

    <line x1="29" y1="29" x2="18" y2="18" stroke="rgba(0, 0, 0, 0.5)" stroke-width="3" stroke-linecap="round" filter="url(#darkGlow)"/>
    <line x1="29" y1="29" x2="18" y2="18" stroke="rgba(196, 165, 123, 0.68)" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Compass star points -->
    <g>
      <path d="M 50 8 L 58 50 L 50 47 L 42 50 Z" fill="rgba(0, 0, 0, 0.6)" stroke="rgba(0, 0, 0, 0.7)" stroke-width="3" filter="url(#darkGlow)"/>
      <path d="M 50 8 L 58 50 L 50 47 L 42 50 Z" fill="#c4a57b" stroke="#8b6842" stroke-width="0.8"/>
      <path d="M 50 8 L 58 50 L 50 47 L 42 50 Z" fill="none" stroke="#c4a57b" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/>

      <path d="M 50 92 L 56 50 L 50 53 L 44 50 Z" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(0, 0, 0, 0.6)" stroke-width="2.5" filter="url(#darkGlow)"/>
      <path d="M 92 50 L 50 44 L 53 50 L 50 56 Z" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(0, 0, 0, 0.6)" stroke-width="2.5" filter="url(#darkGlow)"/>
      <path d="M 8 50 L 50 44 L 47 50 L 50 56 Z" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(0, 0, 0, 0.6)" stroke-width="2.5" filter="url(#darkGlow)"/>

      <path d="M 50 92 L 56 50 L 50 53 L 44 50 Z" fill="rgba(196, 165, 123, 0.88)" stroke="rgba(139, 104, 66, 0.88)" stroke-width="0.5"/>
      <path d="M 92 50 L 50 44 L 53 50 L 50 56 Z" fill="rgba(196, 165, 123, 0.88)" stroke="rgba(139, 104, 66, 0.88)" stroke-width="0.5"/>
      <path d="M 8 50 L 50 44 L 47 50 L 50 56 Z" fill="rgba(196, 165, 123, 0.88)" stroke="rgba(139, 104, 66, 0.88)" stroke-width="0.5"/>
    </g>

    <!-- Inner decorative ring -->
    <circle cx="50" cy="50" r="25" fill="none" stroke="rgba(196, 165, 123, 0.3)" stroke-width="0.5"/>

    <!-- "N" letter near north arrow, layered stroke for depth -->
    <text x="50" y="62" text-anchor="middle" font-size="36" font-weight="bold" letter-spacing="1" fill="none" stroke="rgba(0, 0, 0, 1)" stroke-width="7.65" font-family="serif">N</text>
    <text x="50" y="62" text-anchor="middle" font-size="36" font-weight="bold" letter-spacing="1" fill="none" stroke="rgba(0, 0, 0, 1)" stroke-width="6.12" font-family="serif">N</text>
    <text x="50" y="62" text-anchor="middle" font-size="36" font-weight="bold" letter-spacing="1" fill="none" stroke="rgba(0, 0, 0, 0.9)" stroke-width="4.59" font-family="serif">N</text>
    <text x="50" y="62" text-anchor="middle" font-size="36" font-weight="bold" letter-spacing="1" fill="#c4a57b" font-family="serif">N</text>

    <!-- Red north indicator arrow -->
    <path d="M 50 14 L 44.4 25.2 L 50 21 L 55.6 25.2 Z" fill="rgba(0, 0, 0, 0.7)" stroke="rgba(0, 0, 0, 0.8)" stroke-width="2.5" filter="url(#darkGlow)"/>
    <path d="M 50 14 L 44.4 25.2 L 50 21 L 55.6 25.2 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="0.8"/>
    <circle cx="50" cy="14" r="3" fill="#e74c3c" opacity="0.4" filter="url(#glow)"/>
  </g>
</svg>
