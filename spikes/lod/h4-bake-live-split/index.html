<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LOD spike — h4-bake-live-split</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  /* capture.mjs reads the blank-frame reference colour from body's computed background */
  body { background: #0b0e13; color: #dfe7f2; font: 12px/1.4 ui-monospace, Consolas, monospace; }
  #stage-root { position: fixed; inset: 0; }
  #stage-root canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
  <div id="stage-root"><canvas id="stage"></canvas></div>
  <!-- IIFE bundle on purpose: chromium refuses ES modules over file:// -->
  <script src="dist/bundle.js"></script>
</body>
</html>
